name: Build Native Swift IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          brew install xcodegen

      - name: Download Precompiled MobileVLCKit XCFramework
        run: |
          mkdir -p Frameworks
          echo "Downloading MobileVLCKit official XCFramework binary..."
          curl -L --retry 3 --retry-delay 2 -o MobileVLCKit.xcframework.zip "https://github.com/showbie/MobileVLCKit-SPM/releases/download/3.7.3/MobileVLCKit.xcframework.zip"
          unzip -q MobileVLCKit.xcframework.zip -d Frameworks/
          rm -f MobileVLCKit.xcframework.zip
          echo "MobileVLCKit extracted successfully:"
          ls -ld Frameworks/MobileVLCKit.xcframework

      - name: Create Info.plist with Domain Specific ATS
        run: |
          mkdir -p StreamOSNative
          cat << 'EOF' > StreamOSNative/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>StreamOS</string>
            <key>CFBundleExecutable</key>
            <string>StreamOS</string>
            <key>CFBundleIdentifier</key>
            <string>com.casdavidm.streamos</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>StreamOS</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UISupportedInterfaceOrientations~ipad</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationPortraitUpsideDown</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                </array>
                <key>CFBundleIconName</key>
                <string>AppIcon</string>
              </dict>
            </dict>
            <key>CFBundleIcons~ipad</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                  <string>AppIcon76x76</string>
                  <string>AppIcon83.5x83.5</string>
                </array>
                <key>CFBundleIconName</key>
                <string>AppIcon</string>
              </dict>
            </dict>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
              <key>NSAllowsArbitraryLoadsInMedia</key>
              <true/>
              <key>NSAllowsLocalNetworking</key>
              <true/>
              <key>NSExceptionDomains</key>
              <dict>
                <key>veotv.info</key>
                <dict>
                  <key>NSIncludesSubdomains</key>
                  <true/>
                  <key>NSTemporaryExceptionAllowsInsecureHTTPLoads</key>
                  <true/>
                  <key>NSTemporaryExceptionMinimumTLSVersion</key>
                  <string>TLSv1.0</string>
                  <key>NSExceptionAllowsInsecureHTTPLoads</key>
                  <true/>
                  <key>NSExceptionRequiresForwardSecrecy</key>
                  <false/>
                </dict>
              </dict>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Create Project Definition
        run: |
          cat << 'EOF' > project.yml
          name: StreamOS
          options:
            bundleIdPrefix: com.casdavidm
            deploymentTarget:
              iOS: "16.0"
          targets:
            StreamOS:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: StreamOSNative
                  excludes:
                    - "Info.plist"
              dependencies:
                - framework: Frameworks/MobileVLCKit.xcframework
                  embed: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.streamos
                  INFOPLIST_FILE: StreamOSNative/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: "1.0"
                  SWIFT_VERSION: "5.0"
                  ENABLE_BITCODE: NO
                  DEFINES_MODULE: YES
                  ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
                  FRAMEWORK_SEARCH_PATHS:
                    - "$(inherited)"
                    - "$(PROJECT_DIR)/Frameworks"
                    - "$(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64"
                  OTHER_LDFLAGS:
                    - "$(inherited)"
                    - "-lc++"
                    - "-lbz2"
                    - "-lz"
                    - "-liconv"
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Compile Native Application with xcodebuild
        run: |
          xcodebuild build \
            -project StreamOS.xcodeproj \
            -scheme StreamOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify ATS and Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/StreamOS.app Payload/
          cp StreamOSNative/Info.plist Payload/StreamOS.app/Info.plist
          cp StreamOSNative/AppIcon*.png Payload/StreamOS.app/ 2>/dev/null || true
          cp StreamOSNative/logo.png Payload/StreamOS.app/ 2>/dev/null || true
          cp StreamOSNative/tab_*.png Payload/StreamOS.app/ 2>/dev/null || true
          plutil -convert binary1 Payload/StreamOS.app/Info.plist
          plutil -p Payload/StreamOS.app/Info.plist | grep -A 5 NSAppTransportSecurity || true
          plutil -p Payload/StreamOS.app/Info.plist | grep -A 10 CFBundleIcons || true
          
          # Verificar presencia de MobileVLCKit.framework
          if [ -d "Frameworks/MobileVLCKit.xcframework/ios-arm64/MobileVLCKit.framework" ]; then
            mkdir -p Payload/StreamOS.app/Frameworks
            if [ ! -d "Payload/StreamOS.app/Frameworks/MobileVLCKit.framework" ]; then
              echo "Embedding MobileVLCKit.framework into App bundle..."
              cp -R Frameworks/MobileVLCKit.xcframework/ios-arm64/MobileVLCKit.framework Payload/StreamOS.app/Frameworks/
            fi
            echo "Frameworks in app:"
            ls -ld Payload/StreamOS.app/Frameworks/*
          fi

          zip -qr StreamOS.ipa Payload
          ls -lh StreamOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamOS-IPA-${{ matrix.runner }}
          path: StreamOS.ipa
