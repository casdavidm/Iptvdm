name: Build Native Swift IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Clean Previous Builds
        run: |
          rm -rf Frameworks Podfile Podfile.lock Pods Payload *.ipa

      - name: Create Project Definition with ATS Permissions
        run: |
          cat << 'EOF' > project.yml
          name: StreamOS
          options:
            bundleIdPrefix: com.casdavidm
            deploymentTarget:
              iOS: "15.0"
          targets:
            StreamOS:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: StreamOSNative
              info:
                path: StreamOSNative/Info.plist
                properties:
                  CFBundleDisplayName: "StreamOS"
                  CFBundleIdentifier: "com.casdavidm.streamos"
                  CFBundleShortVersionString: "1.0"
                  CFBundleVersion: "1"
                  LSRequiresIPhoneOS: true
                  UILaunchScreen: {}
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                    NSAllowsArbitraryLoadsInMedia: true
                    NSAllowsLocalNetworking: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.streamos
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: "1.0"
                  SWIFT_VERSION: "5.0"
                  ENABLE_BITCODE: NO
          EOF

      - name: Generate Info.plist explicitly
        run: |
          mkdir -p StreamOSNative
          cat << 'EOF' > StreamOSNative/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>StreamOS</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>com.casdavidm.streamos</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
              <key>NSAllowsArbitraryLoadsInMedia</key>
              <true/>
              <key>NSAllowsLocalNetworking</key>
              <true/>
            </dict>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Compile Native Application with xcodebuild
        run: |
          xcodebuild build \
            -project StreamOS.xcodeproj \
            -scheme StreamOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Inject ATS directly into built bundle and package IPA
        run: |
          BUILT_APP=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "StreamOS.app" -type d | head -n 1)
          echo "App found at: $BUILT_APP"
          
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$BUILT_APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$BUILT_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$BUILT_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoadsInMedia bool true" "$BUILT_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInMedia bool true" "$BUILT_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$BUILT_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$BUILT_APP/Info.plist"

          mkdir -p Payload
          cp -R "$BUILT_APP" Payload/
          zip -qr StreamOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamOS-IPA
          path: StreamOS.ipa
