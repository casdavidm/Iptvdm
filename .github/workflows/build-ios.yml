name: Build Native Swift VLC IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Ensure Directory Structure
        run: |
          mkdir -p StreamOSNative

      - name: Download MobileVLCKit Binary Framework
        run: |
          echo "Fetching MobileVLCKit prebuilt xcframework..."
          curl -L -o MobileVLCKit.tar.xz "https://download.videolan.org/pub/videolan/vlc-iOS/3.3.16.3/MobileVLCKit-3.3.16.3.tar.xz" || true
          if [ -f MobileVLCKit.tar.xz ]; then
            tar -xf MobileVLCKit.tar.xz
            mv MobileVLCKit.xcframework StreamOSNative/ 2>/dev/null || true
          fi

      - name: Generate Xcode Project Definition (project.yml)
        run: |
          cat << 'EOF' > project.yml
          name: StreamOS
          options:
            bundleIdPrefix: com.casdavidm
            deploymentTarget:
              iOS: "15.0"
          targets:
            StreamOS:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: StreamOSNative
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.streamos
                  INFOPLIST_FILE: StreamOSNative/Info.plist
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
                  ENABLE_BITCODE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  OTHER_LDFLAGS: ["-ObjC", "-framework", "AudioToolbox", "-framework", "AVFoundation", "-framework", "CoreMedia", "-framework", "VideoToolbox", "-lstdc++", "-lbz2", "-lz", "-liconv"]
          EOF

      - name: Generate Info.plist for App Transport Security & Audio
        run: |
          cat << 'EOF' > StreamOSNative/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>StreamOS</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
              <key>NSAllowsArbitraryLoadsInMedia</key>
              <true/>
              <key>NSAllowsLocalNetworking</key>
              <true/>
            </dict>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
          </dict>
          </plist>
          EOF

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Compile Native Xcode Application
        run: |
          xcodebuild clean build \
            -project StreamOS.xcodeproj \
            -scheme StreamOS \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package StreamOS.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "StreamOS.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r StreamOS-NativeVLC.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamOS-NativeVLC-IPA
          path: StreamOS-NativeVLC.ipa
