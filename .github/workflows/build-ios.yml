name: Build Native Swift IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Clean Environment
        run: |
          rm -rf Frameworks Podfile Podfile.lock Pods Payload *.ipa build

      - name: Create Info.plist with App Transport Security
        run: |
          mkdir -p StreamOSNative
          cat << 'EOF' > StreamOSNative/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>StreamOS</string>
            <key>CFBundleExecutable</key>
            <string>StreamOS</string>
            <key>CFBundleIdentifier</key>
            <string>com.casdavidm.streamos</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>StreamOS</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
              <key>NSAllowsArbitraryLoadsInMedia</key>
              <true/>
              <key>NSAllowsArbitraryLoadsForMedia</key>
              <true/>
              <key>NSAllowsLocalNetworking</key>
              <true/>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Create Project Definition
        run: |
          cat << 'EOF' > project.yml
          name: StreamOS
          options:
            bundleIdPrefix: com.casdavidm
            deploymentTarget:
              iOS: "15.0"
          targets:
            StreamOS:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: StreamOSNative
                  excludes:
                    - "Info.plist"
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.streamos
                  INFOPLIST_FILE: StreamOSNative/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  DEVELOPMENT_TEAM: ""
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: "1.0"
                  SWIFT_VERSION: "5.0"
                  ENABLE_BITCODE: NO
          EOF

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application Archive
        run: |
          xcodebuild archive \
            -project StreamOS.xcodeproj \
            -scheme StreamOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/StreamOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify ATS and Package IPA
        run: |
          mkdir -p Payload
          cp -R build/StreamOS.xcarchive/Products/Applications/StreamOS.app Payload/
          
          cp StreamOSNative/Info.plist Payload/StreamOS.app/Info.plist
          plutil -convert binary1 Payload/StreamOS.app/Info.plist
          
          plutil -p Payload/StreamOS.app/Info.plist | grep -A 5 NSAppTransportSecurity || true

          zip -qr StreamOS.ipa Payload
          ls -lh StreamOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamOS-IPA
          path: StreamOS.ipa
