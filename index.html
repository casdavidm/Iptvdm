<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>StreamOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      background-color: #020617;
      margin: 0;
      padding: 0;
    }
    .ios-header-safe {
      padding-top: max(calc(env(safe-area-inset-top, 0px) + 6px), 42px);
    }
    .ios-bottom-safe {
      padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 8px), 18px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    .live-dot {
      animation: pulse-live 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden flex flex-col justify-between select-none">

  <!-- Main Container -->
  <div class="relative w-full h-full max-w-md mx-auto bg-slate-900 flex flex-col shadow-2xl border-x border-slate-800/80 overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="px-4 ios-header-safe pb-2.5 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 flex items-center justify-between z-20 flex-shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-600 to-orange-500 flex items-center justify-center shadow-lg shadow-rose-600/25">
          <i class="ph-fill ph-television text-base text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-bold text-sm tracking-tight text-white leading-none">StreamOS</h1>
            <span class="text-[9px] font-semibold uppercase px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">NATIVO</span>
          </div>
          <p id="playlist-stats" class="text-[10px] text-slate-400 mt-0.5">Listo</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button type="button" onclick="refreshAutoChannels()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition active:scale-95" title="Recargar">
          <i class="ph ph-arrows-clockwise text-base pointer-events-none"></i>
        </button>
        <button type="button" onclick="togglePiP()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition active:scale-95" title="Picture in Picture">
          <i class="ph ph-picture-in-picture text-base pointer-events-none"></i>
        </button>
        <button type="button" onclick="openPlaylistModal()" class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs shadow-md shadow-rose-600/25 transition active:scale-95">
          <i class="ph-bold ph-gear text-xs pointer-events-none"></i>
          <span>Ajustes</span>
        </button>
      </div>
    </header>

    <!-- Player Video Box -->
    <div class="relative w-full aspect-video bg-black flex-shrink-0 overflow-hidden border-b border-slate-800">
      <video 
        id="video-player" 
        class="w-full h-full object-contain bg-black" 
        playsinline 
        webkit-playsinline 
        controls 
        preload="auto"
      ></video>

      <!-- Loading Overlay -->
      <div id="player-loader" class="hidden absolute inset-0 bg-black/80 backdrop-blur-xs flex flex-col items-center justify-center z-10 pointer-events-none">
        <div class="w-8 h-8 border-3 border-rose-500 border-t-transparent rounded-full animate-spin mb-2"></div>
        <span id="player-loader-text" class="text-[11px] font-medium text-slate-200">Cargando canal...</span>
      </div>

      <!-- Playback Actions Overlay -->
      <div id="player-error" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-3 text-center z-10 space-y-2">
        <div class="w-9 h-9 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
          <i class="ph-fill ph-play-circle text-2xl pointer-events-none"></i>
        </div>
        <div>
          <h3 class="text-xs font-bold text-white">Iniciar Reproducción</h3>
          <p id="error-reason-text" class="text-[10px] text-slate-400 max-w-[280px] mt-0.5 leading-snug">
            Toca una de las opciones para sintonizar:
          </p>
        </div>

        <div class="flex flex-col gap-1.5 w-full max-w-[260px]">
          <button type="button" onclick="forceNativePlay()" class="w-full py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md active:scale-95">
            <i class="ph-bold ph-play text-xs pointer-events-none"></i>
            <span>Reproducir Pantalla Completa</span>
          </button>

          <button type="button" onclick="switchStreamFormat()" class="w-full py-1.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white transition flex items-center justify-center gap-1.5 shadow-md active:scale-95">
            <i class="ph-bold ph-swap text-xs pointer-events-none"></i>
            <span id="btn-format-toggle-text">Cambiar Formato (HLS / TS)</span>
          </button>

          <button type="button" onclick="openInVlcApp()" class="w-full py-1.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-[11px] font-semibold text-amber-400 transition flex items-center justify-center gap-1.5 border border-slate-700 active:scale-95">
            <i class="ph-bold ph-broadcast text-xs pointer-events-none"></i>
            <span>Abrir en VLC</span>
          </button>
        </div>
      </div>

      <!-- Live Badge on Top of Video -->
      <div class="absolute top-0 inset-x-0 p-2.5 bg-gradient-to-b from-black/80 via-black/30 to-transparent flex items-center justify-between pointer-events-none">
        <div class="flex items-center gap-1.5">
          <span class="flex items-center gap-1 px-1.5 py-0.5 rounded bg-rose-600/90 text-white font-bold text-[9px] tracking-wider uppercase shadow">
            <span class="w-1.5 h-1.5 rounded-full bg-white live-dot"></span>
            LIVE
          </span>
          <span id="now-playing-title" class="text-xs font-semibold text-white truncate max-w-[190px]">Selecciona un canal</span>
        </div>
        <span id="now-playing-format-badge" class="text-[9px] font-mono px-2 py-0.5 rounded bg-white/15 text-slate-200 backdrop-blur-md">HLS</span>
      </div>
    </div>

    <!-- Mini Control Bar -->
    <div class="px-3 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between text-xs flex-shrink-0">
      <div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
        <div class="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-[11px] text-rose-400 shrink-0">
          TV
        </div>
        <div class="truncate">
          <div id="bar-channel-name" class="font-bold text-white text-xs truncate">Listo</div>
          <div id="bar-channel-epg" class="text-[10px] text-slate-400 truncate">Toca cualquier canal para ver</div>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button type="button" onclick="playPrevChannel()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 active:scale-95 transition">
          <i class="ph-bold ph-caret-left text-sm pointer-events-none"></i>
        </button>
        <button type="button" onclick="toggleCurrentFavorite()" id="bar-fav-btn" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 active:scale-95 transition">
          <i class="ph-fill ph-heart text-sm pointer-events-none"></i>
        </button>
        <button type="button" onclick="playNextChannel()" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 active:scale-95 transition">
          <i class="ph-bold ph-caret-right text-sm pointer-events-none"></i>
        </button>
      </div>
    </div>

    <!-- Search & Filters -->
    <div id="filter-container" class="p-2.5 bg-slate-900/60 border-b border-slate-800 space-y-2 flex-shrink-0">
      <div class="relative flex items-center">
        <i class="ph ph-magnifying-glass absolute left-3 text-slate-400 text-sm pointer-events-none"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar canal o categoría..." 
          oninput="handleSearch()"
          class="w-full pl-8 pr-7 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none focus:border-rose-500"
        />
        <button type="button" id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-2.5 text-slate-400 hover:text-white">
          <i class="ph-fill ph-x-circle text-sm pointer-events-none"></i>
        </button>
      </div>
      <div id="category-pills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
    </div>

    <!-- Channel List Container -->
    <div id="channels-wrapper" class="flex-1 overflow-y-auto px-3 py-2 space-y-1.5"></div>

    <!-- Bottom Tab Navigation -->
    <nav class="bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 pt-2.5 ios-bottom-safe flex items-center justify-around w-full z-30 flex-shrink-0">
      <button type="button" onclick="switchTab('all')" id="tab-all" class="flex-1 flex flex-col items-center justify-center gap-1 py-1 text-rose-500 active:scale-95 transition">
        <i class="ph-fill ph-television-simple text-xl pointer-events-none"></i>
        <span class="text-[10px] font-medium pointer-events-none">Live TV</span>
      </button>

      <button type="button" onclick="switchTab('favorites')" id="tab-favorites" class="flex-1 flex flex-col items-center justify-center gap-1 py-1 text-slate-400 hover:text-slate-200 active:scale-95 transition relative">
        <div class="relative pointer-events-none">
          <i class="ph ph-heart text-xl pointer-events-none"></i>
          <span id="fav-count-badge" class="hidden absolute -top-1 -right-2 bg-rose-600 text-white text-[8px] font-bold px-1 rounded-full">0</span>
        </div>
        <span class="text-[10px] font-medium pointer-events-none">Favoritos</span>
      </button>

      <button type="button" onclick="switchTab('recent')" id="tab-recent" class="flex-1 flex flex-col items-center justify-center gap-1 py-1 text-slate-400 hover:text-slate-200 active:scale-95 transition">
        <i class="ph ph-clock-counter-clockwise text-xl pointer-events-none"></i>
        <span class="text-[10px] font-medium pointer-events-none">Recientes</span>
      </button>

      <button type="button" onclick="openPlaylistModal()" id="tab-playlists" class="flex-1 flex flex-col items-center justify-center gap-1 py-1 text-slate-400 hover:text-slate-200 active:scale-95 transition">
        <i class="ph ph-gear text-xl pointer-events-none"></i>
        <span class="text-[10px] font-medium pointer-events-none">Ajustes</span>
      </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="pointer-events-none fixed top-16 left-1/2 -translate-x-1/2 z-50 opacity-0 transition-all duration-300 transform -translate-y-2">
      <div class="bg-slate-800/95 border border-slate-700 text-white px-3.5 py-1.5 rounded-full shadow-xl flex items-center gap-2 text-xs font-medium backdrop-blur-md">
        <i id="toast-icon" class="ph-fill ph-check-circle text-emerald-400 text-sm"></i>
        <span id="toast-msg">Notificación</span>
      </div>
    </div>

    <!-- Server Settings Modal -->
    <div id="playlist-modal" class="hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-xs flex items-end justify-center p-0">
      <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl p-4 pb-8 shadow-2xl space-y-3.5 max-h-[90dvh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
          <div class="flex items-center gap-2">
            <i class="ph-fill ph-gear text-rose-500 text-lg"></i>
            <h2 class="text-sm font-bold text-white">Configurar Servidor Xtream</h2>
          </div>
          <button type="button" onclick="closePlaylistModal()" class="p-1 rounded-full bg-slate-800 text-slate-400 hover:text-white">
            <i class="ph ph-x text-sm"></i>
          </button>
        </div>

        <!-- Connection Type Selector -->
        <div class="grid grid-cols-2 gap-1.5 bg-slate-800/60 p-1 rounded-xl">
          <button type="button" onclick="setConnMode('xtream')" id="btn-mode-xtream" class="py-1.5 rounded-lg text-xs font-semibold bg-rose-600 text-white transition">Xtream API</button>
          <button type="button" onclick="setConnMode('m3u')" id="btn-mode-m3u" class="py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">Enlace M3U</button>
        </div>

        <!-- Xtream Inputs -->
        <div id="section-xtream" class="space-y-2.5">
          <div>
            <label class="text-[10px] font-semibold text-slate-400 block mb-0.5">Servidor URL</label>
            <input type="text" id="xc-url-input" placeholder="http://veotv.info:8880" value="http://veotv.info:8880" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-rose-500" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-semibold text-slate-400 block mb-0.5">Usuario</label>
              <input type="text" id="xc-user-input" placeholder="DavidMunoz1" value="DavidMunoz1" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-rose-500" />
            </div>
            <div>
              <label class="text-[10px] font-semibold text-slate-400 block mb-0.5">Contraseña</label>
              <input type="password" id="xc-pass-input" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-rose-500" />
            </div>
          </div>
        </div>

        <!-- M3U Input -->
        <div id="section-m3u" class="hidden space-y-2.5">
          <div>
            <label class="text-[10px] font-semibold text-slate-400 block mb-0.5">URL M3U o M3U_PLUS</label>
            <input type="text" id="m3u-url-input" placeholder="http://veotv.info:8880/get.php?username=...&password=...&type=m3u_plus" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-rose-500" />
          </div>
        </div>

        <div class="pt-1">
          <button type="button" onclick="connectActiveMode()" id="xc-login-btn" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs shadow-md shadow-rose-600/25 transition flex items-center justify-center gap-1.5 active:scale-95">
            <i class="ph-bold ph-plug text-xs"></i>
            <span>Conectar y Sincronizar Canales</span>
          </button>
        </div>

        <div id="modal-status-box" class="hidden p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/80 text-[11px] text-slate-300 flex items-start gap-2">
          <i id="modal-status-icon" class="ph ph-spinner animate-spin text-rose-400 text-sm mt-0.5 shrink-0"></i>
          <span id="modal-status-text" class="break-words">Conectando...</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    let allChannels = [];
    let filteredChannels = [];
    let currentChannelIndex = -1;
    let activeCategory = 'All';
    let activeTab = 'all';
    let connMode = 'xtream';
    let favorites = JSON.parse(localStorage.getItem('streamos_favs') || '[]');
    let recentIds = JSON.parse(localStorage.getItem('streamos_recent') || '[]');
    let hlsInstance = null;
    let currentMode = 'hls';

    const videoEl = document.getElementById('video-player');
    const loaderEl = document.getElementById('player-loader');
    const loaderTextEl = document.getElementById('player-loader-text');
    const errorEl = document.getElementById('player-error');

    // Motor de red universal: usa Capacitor Native HTTP si está disponible, con fallback a fetch
    async function universalHttp(url) {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Http) {
        const res = await window.Capacitor.Plugins.Http.get({ url: url });
        return typeof res.data === 'string' ? res.data : JSON.stringify(res.data);
      }
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.text();
    }

    window.onload = function() {
      updateFavBadge();

      const savedXc = JSON.parse(localStorage.getItem('streamos_xc_creds') || 'null');
      if (savedXc) {
        document.getElementById('xc-url-input').value = savedXc.serverUrl || 'http://veotv.info:8880';
        document.getElementById('xc-user-input').value = savedXc.username || 'DavidMunoz1';
        document.getElementById('xc-pass-input').value = savedXc.password || '';
      }

      const savedStreams = JSON.parse(localStorage.getItem('streamos_saved_channels') || 'null');
      if (Array.isArray(savedStreams) && savedStreams.length > 0) {
        allChannels = savedStreams;
        renderCategories();
        applyFilters();
      }
    };

    function setConnMode(mode) {
      connMode = mode;
      const bX = document.getElementById('btn-mode-xtream');
      const bM = document.getElementById('btn-mode-m3u');
      const sX = document.getElementById('section-xtream');
      const sM = document.getElementById('section-m3u');

      if (mode === 'xtream') {
        bX.className = 'py-1.5 rounded-lg text-xs font-semibold bg-rose-600 text-white transition';
        bM.className = 'py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
        sX.classList.remove('hidden');
        sM.classList.add('hidden');
      } else {
        bM.className = 'py-1.5 rounded-lg text-xs font-semibold bg-rose-600 text-white transition';
        bX.className = 'py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition';
        sM.classList.remove('hidden');
        sX.classList.add('hidden');
      }
    }

    function showModalStatus(text, isSpinning = true) {
      const box = document.getElementById('modal-status-box');
      const txt = document.getElementById('modal-status-text');
      const ico = document.getElementById('modal-status-icon');
      box.classList.remove('hidden');
      txt.textContent = text;
      ico.className = isSpinning ? 'ph ph-spinner animate-spin text-rose-400 text-sm mt-0.5 shrink-0' : 'ph ph-warning text-amber-400 text-sm mt-0.5 shrink-0';
    }

    function cleanUrl(u) {
      let c = (u || '').trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(c)) c = 'http://' + c;
      return c;
    }

    async function connectActiveMode() {
      if (connMode === 'm3u') {
        await connectM3uMode();
      } else {
        await connectXtreamMode();
      }
    }

    async function connectXtreamMode() {
      const rawUrl = document.getElementById('xc-url-input').value;
      const username = document.getElementById('xc-user-input').value.trim();
      const password = document.getElementById('xc-pass-input').value.trim();

      if (!rawUrl || !username || !password) {
        showToast('Completa todos los campos', 'ph-warning');
        return;
      }

      const baseUrl = cleanUrl(rawUrl);
      localStorage.setItem('streamos_xc_creds', JSON.stringify({ serverUrl: baseUrl, username, password }));

      showModalStatus('Conectando vía motor nativo iOS...');
      const apiUrl = `${baseUrl}/player_api.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&action=get_live_streams`;

      try {
        const rawData = await universalHttp(apiUrl);
        let streams = null;
        try {
          streams = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
        } catch (e) {}

        if (Array.isArray(streams) && streams.length > 0) {
          processStreams(streams, baseUrl, username, password);
          return;
        }

        // Si la API JSON no responde lista, probar enlace directo M3U Plus
        showModalStatus('Descargando lista por canal M3U Plus...');
        const m3uUrl = `${baseUrl}/get.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&type=m3u_plus&output=ts`;
        await loadFromM3uUrl(m3uUrl, baseUrl, username, password);
      } catch (err) {
        // Fallback inmediato a M3U Plus nativo
        try {
          showModalStatus('Sincronizando por túnel M3U directo...');
          const m3uUrl = `${baseUrl}/get.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&type=m3u_plus&output=ts`;
          await loadFromM3uUrl(m3uUrl, baseUrl, username, password);
        } catch (e2) {
          showModalStatus(`Error: ${e2.message || 'Verifica credenciales'}`, false);
          showToast('Error de conexión', 'ph-warning');
        }
      }
    }

    async function connectM3uMode() {
      const url = document.getElementById('m3u-url-input').value.trim();
      if (!url) {
        showToast('Ingresa la URL M3U', 'ph-warning');
        return;
      }
      showModalStatus('Descargando lista M3U con red nativa...');
      await loadFromM3uUrl(url);
    }

    async function loadFromM3uUrl(m3uUrl, baseUrl = '', user = '', pass = '') {
      try {
        const text = await universalHttp(m3uUrl);
        const parsed = parseM3U(text, baseUrl, user, pass);

        if (parsed.length > 0) {
          allChannels = parsed;
          localStorage.setItem('streamos_saved_channels', JSON.stringify(allChannels.slice(0, 1800)));
          renderCategories();
          applyFilters();
          showToast(`${allChannels.length} canales listos`, 'ph-check-circle');
          closePlaylistModal();
        } else {
          throw new Error('Lista vacía o sin canales válidos');
        }
      } catch (e) {
        showModalStatus(`Error al descargar: ${e.message}`, false);
        showToast('Error al procesar canales', 'ph-warning');
      }
    }

    function parseM3U(content, baseUrl, user, pass) {
      const lines = content.split('\n');
      const channels = [];
      let temp = {};

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const nameMatch = line.match(/,(.+)$/);
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          temp.name = nameMatch ? nameMatch[1].trim() : 'Canal';
          temp.category = groupMatch ? groupMatch[1].trim() : 'General';
        } else if (line.startsWith('http')) {
          const id = `ch-${channels.length + 1}`;
          const isHls = line.includes('.m3u8');
          channels.push({
            id: id,
            name: temp.name || `Canal ${channels.length + 1}`,
            category: temp.category || 'Live TV',
            epg: `#${channels.length + 1} • En Vivo`,
            hlsUrl: isHls ? line : line.replace(/\.ts$/i, '.m3u8'),
            tsUrl: isHls ? line.replace(/\.m3u8$/i, '') : line,
            url: line
          });
          temp = {};
          if (channels.length >= 2500) break;
        }
      }
      return channels;
    }

    function processStreams(streams, baseUrl, user, pass) {
      allChannels = streams.map((st, idx) => {
        const rawName = st.name || `Canal ${idx + 1}`;
        let cat = 'Live TV';
        const match = rawName.match(/^([A-Za-z0-9\s★\-]{2,14})[|:\-]/);
        if (match) cat = match[1].trim();

        const streamId = st.stream_id || idx;
        const hlsUrl = `${baseUrl}/live/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${streamId}.m3u8`;
        const tsUrl = `${baseUrl}/${encodeURIComponent(user)}/${encodeURIComponent(pass)}/${streamId}`;

        return {
          id: `xc-${streamId}`,
          name: rawName,
          category: cat,
          epg: `#${st.num || idx + 1} • En Vivo`,
          hlsUrl: hlsUrl,
          tsUrl: tsUrl,
          url: hlsUrl
        };
      });

      localStorage.setItem('streamos_saved_channels', JSON.stringify(allChannels.slice(0, 1800)));
      renderCategories();
      applyFilters();
      showToast(`${allChannels.length} canales listos`, 'ph-check-circle');
      closePlaylistModal();
    }

    function refreshAutoChannels() {
      const savedXc = JSON.parse(localStorage.getItem('streamos_xc_creds') || 'null');
      if (savedXc) {
        showToast('Actualizando canales...', 'ph-arrows-clockwise');
        connectXtreamMode();
      } else {
        openPlaylistModal();
      }
    }

    function selectCategory(catName) {
      activeCategory = catName;
      renderCategories();
      applyFilters();
    }

    function renderCategories() {
      const container = document.getElementById('category-pills');
      container.innerHTML = '';
      const unique = ['All', ...new Set(allChannels.map(c => c.category || 'Live TV'))].slice(0, 35);

      unique.forEach(cat => {
        const btn = document.createElement('button');
        const active = cat === activeCategory;
        btn.className = `px-3 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap transition cursor-pointer ${
          active ? 'bg-rose-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700/60'
        }`;
        btn.textContent = cat;
        btn.onclick = () => selectCategory(cat);
        container.appendChild(btn);
      });
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const clearBtn = document.getElementById('clear-search-btn');
      if (query) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');

      let base = [...allChannels];
      if (activeTab === 'favorites') {
        base = base.filter(c => favorites.includes(c.id));
      } else if (activeTab === 'recent') {
        base = recentIds.map(id => allChannels.find(c => c.id === id)).filter(Boolean);
      }

      if (activeCategory !== 'All') {
        base = base.filter(c => c.category === activeCategory);
      }

      if (query) {
        base = base.filter(c => c.name.toLowerCase().includes(query));
      }

      filteredChannels = base;
      const statsPrefix = activeTab === 'favorites' ? 'Favoritos' : activeTab === 'recent' ? 'Recientes' : 'VEO TV';
      document.getElementById('playlist-stats').textContent = `${statsPrefix} • ${filteredChannels.length} Canales`;
      renderChannelList();
    }

    function selectChannel(channelId, autoPlay = true) {
      const idx = allChannels.findIndex(c => c.id === channelId);
      if (idx === -1) return;
      currentChannelIndex = idx;
      const ch = allChannels[idx];

      document.getElementById('now-playing-title').textContent = ch.name;
      document.getElementById('bar-channel-name').textContent = ch.name;
      document.getElementById('bar-channel-epg').textContent = ch.epg;

      updateCurrentFavButton(ch.id);
      addToRecent(ch.id);
      renderChannelList();

      currentMode = 'hls';
      playStreamWithMode(ch);
    }

    function destroyActivePlayer() {
      if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
      }
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
    }

    function playStreamWithMode(ch) {
      errorEl.classList.add('hidden');
      loaderEl.classList.remove('hidden');
      loaderTextEl.textContent = 'Conectando canal...';
      destroyActivePlayer();

      const targetUrl = (currentMode === 'hls') ? (ch.hlsUrl || ch.url) : (ch.tsUrl || ch.url);
      document.getElementById('now-playing-format-badge').textContent = currentMode.toUpperCase();

      let timeout = setTimeout(() => {
        loaderEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
      }, 7000);

      const onReady = () => {
        clearTimeout(timeout);
        loaderEl.classList.add('hidden');
        errorEl.classList.add('hidden');
        videoEl.play().catch(() => {});
      };

      const onError = () => {
        clearTimeout(timeout);
        loaderEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
      };

      // Reproducción nativa en iOS (WebKit AVPlayer)
      if (videoEl.canPlayType('application/vnd.apple.mpegurl') || currentMode === 'ts') {
        videoEl.src = targetUrl;
        videoEl.onplaying = onReady;
        videoEl.onloadeddata = onReady;
        videoEl.onerror = onError;
        videoEl.play().catch(() => {
          loaderEl.classList.add('hidden');
          errorEl.classList.remove('hidden');
        });
        return;
      }

      // HLS.js
      if (Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(targetUrl);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, onReady);
        hlsInstance.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) onError();
        });
      }
    }

    function forceNativePlay() {
      const ch = allChannels[currentChannelIndex];
      if (!ch) return;
      errorEl.classList.add('hidden');
      videoEl.src = ch.hlsUrl || ch.url;
      videoEl.play().catch(() => {
        videoEl.src = ch.tsUrl;
        videoEl.play();
      });
      if (videoEl.webkitEnterFullscreen) {
        videoEl.webkitEnterFullscreen();
      }
    }

    function switchStreamFormat() {
      const ch = allChannels[currentChannelIndex];
      if (!ch) return;
      currentMode = (currentMode === 'hls') ? 'ts' : 'hls';
      showToast(`Modo ${currentMode.toUpperCase()}`, 'ph-swap');
      playStreamWithMode(ch);
    }

    function openInVlcApp() {
      const ch = allChannels[currentChannelIndex];
      if (!ch) return;
      const targetUrl = ch.tsUrl || ch.url;
      window.location.href = `vlc://${targetUrl}`;
      showToast('Abriendo en VLC...', 'ph-broadcast');
    }

    function playPrevChannel() {
      if (filteredChannels.length === 0) return;
      const curId = allChannels[currentChannelIndex]?.id;
      const idx = filteredChannels.findIndex(c => c.id === curId);
      const prevIdx = idx > 0 ? idx - 1 : filteredChannels.length - 1;
      selectChannel(filteredChannels[prevIdx].id, true);
    }

    function playNextChannel() {
      if (filteredChannels.length === 0) return;
      const curId = allChannels[currentChannelIndex]?.id;
      const idx = filteredChannels.findIndex(c => c.id === curId);
      const nextIdx = idx < filteredChannels.length - 1 ? idx + 1 : 0;
      selectChannel(filteredChannels[nextIdx].id, true);
    }

    function renderChannelList() {
      const container = document.getElementById('channels-wrapper');
      container.innerHTML = '';
      if (filteredChannels.length === 0) {
        container.innerHTML = `<div class="text-center py-10 px-4 text-xs text-slate-500">No hay canales cargados. Pulsa Ajustes para conectar.</div>`;
        return;
      }
      const curId = allChannels[currentChannelIndex]?.id;
      filteredChannels.slice(0, 100).forEach(ch => {
        const isPlaying = ch.id === curId;
        const isFav = favorites.includes(ch.id);
        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-2 rounded-xl border transition cursor-pointer ${
          isPlaying ? 'bg-rose-600/15 border-rose-500/50' : 'bg-slate-800/40 hover:bg-slate-800/80 border-slate-800/80'
        }`;
        row.onclick = () => selectChannel(ch.id, true);
        row.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-[10px] text-slate-300 shrink-0">
              TV
            </div>
            <div class="min-w-0 flex-1">
              <div class="text-xs font-bold ${isPlaying ? 'text-rose-400' : 'text-slate-100'} truncate">${ch.name}</div>
              <div class="text-[10px] text-slate-400 truncate">${ch.epg}</div>
            </div>
          </div>
          <button type="button" onclick="event.stopPropagation(); toggleFavorite('${ch.id}')" class="p-2 text-slate-500 hover:text-rose-500 cursor-pointer">
            <i class="${isFav ? 'ph-fill text-rose-500' : 'ph'} ph-heart text-sm pointer-events-none"></i>
          </button>
        `;
        container.appendChild(row);
      });
    }

    function toggleFavorite(id) {
      const i = favorites.indexOf(id);
      if (i > -1) favorites.splice(i, 1);
      else favorites.push(id);
      localStorage.setItem('streamos_favs', JSON.stringify(favorites));
      updateFavBadge();
      updateCurrentFavButton(allChannels[currentChannelIndex]?.id);
      applyFilters();
    }

    function toggleCurrentFavorite() {
      const ch = allChannels[currentChannelIndex];
      if (ch) toggleFavorite(ch.id);
    }

    function updateCurrentFavButton(id) {
      const isFav = favorites.includes(id);
      document.getElementById('bar-fav-btn').className = `p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 transition ${isFav ? 'text-rose-500' : 'text-slate-400'}`;
    }

    function updateFavBadge() {
      const badge = document.getElementById('fav-count-badge');
      if (favorites.length > 0) {
        badge.textContent = favorites.length;
        badge.classList.remove('hidden');
      } else badge.classList.add('hidden');
    }

    function addToRecent(id) {
      recentIds = [id, ...recentIds.filter(x => x !== id)].slice(0, 20);
      localStorage.setItem('streamos_recent', JSON.stringify(recentIds));
    }

    function switchTab(tab) {
      activeTab = tab;
      ['all', 'favorites', 'recent'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (!el) return;
        if (t === tab) {
          el.className = 'flex-1 flex flex-col items-center justify-center gap-1 py-1 text-rose-500 active:scale-95 transition cursor-pointer';
        } else {
          el.className = 'flex-1 flex flex-col items-center justify-center gap-1 py-1 text-slate-400 hover:text-slate-200 active:scale-95 transition cursor-pointer';
        }
      });
      applyFilters();
    }

    function handleSearch() { applyFilters(); }
    function clearSearch() { document.getElementById('search-input').value = ''; applyFilters(); }

    function openPlaylistModal() { document.getElementById('playlist-modal').classList.remove('hidden'); }
    function closePlaylistModal() { document.getElementById('playlist-modal').classList.add('hidden'); }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else if (videoEl.webkitSupportsPresentationMode) videoEl.webkitSetPresentationMode('picture-in-picture');
        else if (document.pictureInPictureEnabled) await videoEl.requestPictureInPicture();
      } catch (e) { showToast('PiP no disponible', 'ph-info'); }
    }

    let toastTimeout = null;
    function showToast(msg, icon = 'ph-check-circle') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      document.getElementById('toast-icon').className = `ph-fill ${icon} text-emerald-400 text-sm`;
      t.classList.remove('opacity-0', '-translate-y-2');
      t.classList.add('opacity-100', 'translate-y-0');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        t.classList.add('opacity-0', '-translate-y-2');
        t.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }
  </script>
</body>
</html>
