name: StreamOS
options:
  bundleIdPrefix: com.casdavidm
  deploymentTarget:
    iOS: "15.0"
targets:
  StreamOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: StreamOSNative
        excludes:
          - "Info.plist"
    dependencies:
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casdavidm.streamos
        INFOPLIST_FILE: StreamOSNative/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        DEFINES_MODULE: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
          - "$(PROJECT_DIR)/Frameworks/MobileVLCKit.xcframework/ios-arm64"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "MobileVLCKit"
          - "-lc++"
          - "-lbz2"
          - "-lz"
          - "-liconv"
